# Linux hosts only: the single-user app with your ALSA sound devices (audio interface / USB cable),
# listening on the server's own input, without accounts or the database:
#   docker compose -f compose.yaml -f compose.linux-audio.yaml up --build guitarr
services:
  guitarr:
    environment:
      GUITARR_DATABASE_URL: ""     # off: the single-user app
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    depends_on: !reset {}
