# guitarr as a web service, on your machine, with Docker Compose.
#
#   docker compose up --build          → http://localhost:8765
#   GUITARR_PORT=8766 docker compose up --build      (if the local app already uses 8765)
#
# Sign in with your email: without SMTP settings the one-time link is printed to the log
# (docker compose logs guitarr). The guitar is captured by your browser and streamed to the
# server, so live listening works on macOS and Windows too. The browser only opens the
# microphone on https:// or on localhost: on the internet, add compose.https.yaml (https in front,
# several app replicas).
#
# Services, in order: db (Postgres) → migrate (applies the pending schema migrations, then
# exits) → guitarr (the app) and worker (the slow jobs: transcribing recordings, analyzing takes;
# run more with `docker compose up --scale worker=3`), which start only if the migrations succeeded.
# Schema changes:
#
#   docker compose run --rm migrate guitarr db status
#   .venv/bin/python -m guitarr db new add_something     (then edit guitarr/db/migrations/NNNN_add_something.sql)
#
# Settings come from the environment or a .env file beside this one (POSTGRES_PASSWORD,
# GUITARR_SMTP_HOST, GUITARR_SMTP_PORT, GUITARR_SMTP_USER, GUITARR_SMTP_PASSWORD, GUITARR_SMTP_TLS,
# GUITARR_MAIL_FROM, GUITARR_PUBLIC_URL,
# GUITARR_QUOTA_MB: each user's space for songs and takes, GUITARR_JOBS_PER_USER: jobs waiting at once,
# GUITARR_ADMINS: the emails that see the admin page).
x-guitarr: &guitarr
  image: guitarr:web
  environment:
    GUITARR_DATABASE_URL: postgresql://guitarr:${POSTGRES_PASSWORD:-guitarr}@db:5432/guitarr
    GUITARR_PUBLIC_URL: ${GUITARR_PUBLIC_URL:-http://localhost:${GUITARR_PORT:-8765}}
    GUITARR_SMTP_HOST: ${GUITARR_SMTP_HOST:-}
    GUITARR_SMTP_PORT: ${GUITARR_SMTP_PORT:-587}
    GUITARR_SMTP_USER: ${GUITARR_SMTP_USER:-}
    GUITARR_SMTP_PASSWORD: ${GUITARR_SMTP_PASSWORD:-}
    GUITARR_SMTP_TLS: ${GUITARR_SMTP_TLS:-}    # starttls (ssl on port 465; off for a local mail catcher)
    GUITARR_MAIL_FROM: ${GUITARR_MAIL_FROM:-guitarr <no-reply@localhost>}
    GUITARR_QUOTA_MB: ${GUITARR_QUOTA_MB:-1000}
    GUITARR_JOBS_PER_USER: ${GUITARR_JOBS_PER_USER:-3}
    GUITARR_WORKERS: "0"        # the app runs no jobs itself: the worker service does
    GUITARR_ADMINS: ${GUITARR_ADMINS:-}     # emails that see the admin page (comma separated)

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: guitarr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guitarr}
      POSTGRES_DB: guitarr
    volumes:
      - guitarr-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guitarr -d guitarr"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *guitarr
    command: ["guitarr", "db", "migrate"]
    pull_policy: never          # the image the guitarr service builds
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  guitarr:
    <<: *guitarr
    container_name: guitarr
    build: .
    pull_policy: build          # rebuilt on every up (cached layers make it quick): never a stale image
    ports:
      - "127.0.0.1:${GUITARR_PORT:-8765}:8765"   # this machine only (GUITARR_PORT=8766 if the local app uses 8765)
    volumes:
      - guitarr-data:/data      # each user's files (/data/users/<id>: songs, takes, IRs) and the shared cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *guitarr
    command: ["guitarr", "worker"]
    pull_policy: never          # the image the guitarr service builds
    healthcheck:
      disable: true             # the image's check asks the web app, which isn't in this container
    volumes:
      - guitarr-data:/data      # the songs to transcribe and the cache it fills
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  guitarr-db:
  guitarr-data:
